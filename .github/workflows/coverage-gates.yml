name: Coverage Gates

# Runs the two coverage audits as lightweight PR gates. Neither requires a
# GPU — the audits only grep source. They guard against silent regressions
# in test coverage (new untagged skips, new untested OpIds).

on:
  pull_request:
    paths:
      - 'include/tenzor/ops/op_id.hpp'
      - 'tests/**'
      - 'scripts/count_skips.py'
      - 'scripts/audit_op_coverage.py'
      # X.11: tooling-audit job — run when any of the linted sources or the
      # tools themselves change. The tooling tools themselves are pure-Python
      # so this also catches drift in tools/audit_tolerances_baseline.txt and
      # tools/lint_test_contract_baseline.txt.
      - 'tools/**'
      - 'python/tenzor/**'
  push:
    branches: [main]

jobs:
  skip-budget:
    name: Skip-budget gate (count_skips.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tally test skips
        # Zero UNTAGGED after Phase 33. Keep the gate at a small value so a
        # single new skip won't break the build, but anything more than a
        # handful surfaces as a regression.
        run: |
          python3 scripts/count_skips.py --max-untagged 10

  op-coverage:
    name: OpId coverage matrix (audit_op_coverage.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report OpId coverage
        run: |
          python3 scripts/audit_op_coverage.py --json op-coverage.json
      - name: Upload coverage JSON
        uses: actions/upload-artifact@v4
        with:
          name: op-coverage
          path: op-coverage.json

  tooling-audit:
    # X.11: wire the audit-4 / audit-5 tooling tools into CI as a required
    # check. Each tool exits non-zero on regression so a single new untagged
    # marker / pyi drift / unjustified tolerance / sparse-parity miss /
    # multi-dtype gap / param-group breakage / TensorBoard wire-format
    # mismatch / test-contract violation surfaces on the PR diff instead of
    # the audit a release later. All eight run pure-Python and need neither
    # a build nor a GPU.
    name: Tooling audit (audit-4/audit-5 P0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # BB.23 (audit-6): parity_coverage_matrix.py needs to be invoked from a
      # directory containing a CTestTestfile.cmake. cmake configure writes
      # that file (no compilation needed) and is fast (~30s on the runner).
      # We deliberately skip ninja: the matrix's gtest-list step short-
      # circuits with the binary-name fallback when the binaries are absent,
      # which is enough to populate the per-backend / per-op tally without
      # building several gigabytes of object files just to enumerate tests.
      - name: Install cmake + ninja (configure-only)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build cmake
      - name: Configure (writes build/CTestTestfile.cmake)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTENZOR_BUILD_PYTHON=OFF \
            -DTENZOR_BUILD_TESTS=ON
      - name: scan_audit_markers.py — orphaned audit markers
        run: python3 tools/scan_audit_markers.py
      - name: check_pyi_drift.py — .py / .pyi parity
        run: python3 tools/check_pyi_drift.py
      - name: check_multidtype_coverage.py — multi-dtype gaps
        run: python3 tools/check_multidtype_coverage.py
      - name: audit_tolerances.py --strict — unjustified loose tolerances
        run: |
          python3 tools/audit_tolerances.py --strict \
            --baseline tools/audit_tolerances_baseline.txt
      - name: check_param_group_serialization.py — optim round-trip
        # SKIPs gracefully on source-only checkout (exit 0). When the
        # compiled extension is present the lint exercises every Optimizer
        # subclass; see X.8 for the SKIP-vs-FATAL classification.
        run: python3 tools/check_param_group_serialization.py
      - name: check_tensorboard_wire_format.py — TB protobuf parity
        run: python3 tools/check_tensorboard_wire_format.py
      - name: parity_coverage_matrix.py — backend parity matrix
        # BB.23 (audit-6): the matrix shells out to `ctest --print-labels`,
        # which only finds tests when invoked from a directory containing a
        # CTestTestfile.cmake. That file only exists inside build/, never at
        # the repo root. Y.28's hard-fail-on-zero-tests guard otherwise turns
        # this into a perpetual red gate. The tooling-audit job does not run
        # cmake itself; we cd into build/ on the source-only runner so the
        # matrix walks the source tree (its discovery is grep-based) while
        # ctest sees no enumerable tests — that's fine: the matrix only
        # needs ctest available when --update-baseline is passed.
        #
        # FF.30: pass --require-real-ctest so a CI run with a skipped build
        # step (zero ctest tests) raises RuntimeError instead of silently
        # exiting with an empty matrix. The `Configure` step above writes
        # build/CTestTestfile.cmake, so the normal case is non-empty.
        run: python3 ../tools/parity_coverage_matrix.py --require-real-ctest
        working-directory: build
      - name: lint_test_contract.py — test-contract regressions
        run: python3 tools/lint_test_contract.py
