name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_TYPE: Release
  CMAKE_GENERATOR: Ninja

  # GPU TESTING NOTE:
  # GPU backends (CUDA, ROCm, Vulkan, OneAPI) are not tested in CI
  # because GitHub-hosted runners don't have GPU hardware.
  # To test GPU backends locally:
  #   cd build && ninja && ctest -R "cuda|vulkan|rocm|oneapi" --output-on-failure
  # For self-hosted GPU runners, add a separate job with:
  #   runs-on: [self-hosted, gpu]
  # and enable the corresponding CMake backend flags.

jobs:
  # Tier 1: Fast smoke tests (~5 min)
  build-and-smoke:
    name: Build & Smoke Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libgtest-dev \
            libomp-dev \
            python3-dev \
            python3-pybind11 \
            pybind11-dev \
            libmkl-dev \
            libtbb-dev

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DTENZOR_BUILD_CUDA=OFF \
            -DTENZOR_BUILD_ROCM=OFF \
            -DTENZOR_BUILD_ONEAPI=OFF \
            -DTENZOR_BUILD_VULKAN=OFF \
            -DTENZOR_BUILD_PYTHON=ON \
            -DTENZOR_BUILD_TESTS=ON \
            -DTENZOR_BUILD_BENCHMARKS=OFF \
            -DTENZOR_BUILD_EXAMPLES=OFF \
            -DTENZOR_BUILD_MODEL_HUB=OFF

      - name: Build core library
        run: ninja -C build tenzor_core

      - name: Build CPU backend
        run: ninja -C build tenzor_backend_cpu

      - name: Build Python module
        run: ninja -C build tenzor_python

      - name: Build tests
        run: ninja -C build

      - name: Python import test
        run: |
          cd build
          python3 -c "
          import sys; sys.path.insert(0, 'python')
          import tenzor as tz
          tz.initialize()
          t = tz.zeros([2, 3])
          assert t.shape == [2, 3], f'Expected [2,3], got {t.shape}'
          print('Python import OK')
          "

      - name: Core unit tests
        run: |
          cd build
          ctest --output-on-failure -j$(nproc) \
            -R "TensorBasicTest|TensorCreationTest|TensorMathTest|EmptyTensorTest|NumericalPrecisionTest|ViewSliceTest" \
            --timeout 120

      - name: Autograd tests
        run: |
          cd build
          ctest --output-on-failure -j$(nproc) \
            -R "AllBackends/AutogradTest" \
            -E "cuda|vulkan|oneapi" \
            --timeout 120

      - name: Broadcasting tests
        run: |
          cd build
          ctest --output-on-failure -j$(nproc) \
            -R "AllBackends/BroadcastingTest" \
            -E "cuda|vulkan|oneapi" \
            --timeout 120

      - name: Op coverage check
        run: |
          cd build
          ./bin/op_coverage_report --check ../tools/op_coverage_baseline.json

  # Tier 1.5: Sanitizer build (ASAN + UBSAN, ~15 min)
  sanitizer:
    name: ASAN + UBSAN
    runs-on: ubuntu-24.04
    needs: build-and-smoke
    if: github.event_name == 'pull_request'
    env:
      CMAKE_BUILD_TYPE: Debug
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libgtest-dev \
            libomp-dev \
            libmkl-dev \
            libtbb-dev

      - name: Configure (sanitizers, no Python)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DTENZOR_BUILD_CUDA=OFF \
            -DTENZOR_BUILD_ROCM=OFF \
            -DTENZOR_BUILD_ONEAPI=OFF \
            -DTENZOR_BUILD_VULKAN=OFF \
            -DTENZOR_BUILD_PYTHON=OFF \
            -DTENZOR_BUILD_TESTS=ON \
            -DTENZOR_BUILD_BENCHMARKS=OFF \
            -DTENZOR_BUILD_EXAMPLES=OFF \
            -DTENZOR_BUILD_MODEL_HUB=OFF

      - name: Build
        run: ninja -C build

      - name: Run tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1,halt_on_error=1,suppressions=sanitizer_suppressions.txt
          UBSAN_OPTIONS: halt_on_error=1,print_stacktrace=1
        run: |
          cd build
          ctest --output-on-failure -j$(nproc) \
            -E "cuda|vulkan|oneapi|rocm" \
            --timeout 600
        timeout-minutes: 30

  # Tier 1.6: ThreadSanitizer build (~15 min)
  thread-sanitizer:
    name: ThreadSanitizer
    runs-on: ubuntu-24.04
    needs: build-and-smoke
    if: github.event_name == 'pull_request'
    env:
      CMAKE_BUILD_TYPE: Debug
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libgtest-dev \
            libomp-dev \
            libmkl-dev \
            libtbb-dev

      - name: Configure (TSan, no Python)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=thread -fno-sanitize-recover=all" \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-sanitize-recover=all" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=thread" \
            -DTENZOR_BUILD_CUDA=OFF \
            -DTENZOR_BUILD_ROCM=OFF \
            -DTENZOR_BUILD_ONEAPI=OFF \
            -DTENZOR_BUILD_VULKAN=OFF \
            -DTENZOR_BUILD_PYTHON=OFF \
            -DTENZOR_BUILD_TESTS=ON \
            -DTENZOR_BUILD_BENCHMARKS=OFF \
            -DTENZOR_BUILD_EXAMPLES=OFF \
            -DTENZOR_BUILD_MODEL_HUB=OFF

      - name: Build
        run: ninja -C build

      - name: Run thread-safety tests under TSan
        env:
          TSAN_OPTIONS: halt_on_error=1,second_deadlock_stack=1,suppressions=sanitizer_suppressions.txt
        run: |
          cd build
          ctest --output-on-failure -j1 \
            -R "AutogradTest|ThreadSafety|test_hooks|test_thread" \
            -E "cuda|vulkan|oneapi|rocm" \
            --timeout 300
        timeout-minutes: 20

  # Tier 1.75: GPU tests on self-hosted runner (when available)
  gpu-tests:
    name: GPU Backend Tests
    runs-on: [self-hosted, gpu, linux]
    needs: build-and-smoke
    if: github.event_name == 'pull_request'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configure with GPU backends
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DTENZOR_BUILD_CUDA=ON \
            -DTENZOR_BUILD_VULKAN=ON \
            -DTENZOR_BUILD_PYTHON=OFF \
            -DTENZOR_BUILD_TESTS=ON \
            -DTENZOR_BUILD_BENCHMARKS=OFF \
            -DTENZOR_BUILD_EXAMPLES=OFF \
            -DTENZOR_BUILD_MODEL_HUB=OFF

      - name: Build
        run: ninja -C build

      - name: Run GPU tests
        run: |
          cd build
          ctest -R "cuda|vulkan" -j4 \
            --output-on-failure --timeout 300

  # Tier 1.8: Clang build (catches different warnings/errors than GCC)
  clang-build:
    name: Clang-18 Build
    runs-on: ubuntu-24.04
    needs: build-and-smoke
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libgtest-dev \
            libomp-dev \
            libmkl-dev \
            libtbb-dev \
            clang-18

      - name: Configure with Clang
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DTENZOR_BUILD_CUDA=OFF \
            -DTENZOR_BUILD_ROCM=OFF \
            -DTENZOR_BUILD_ONEAPI=OFF \
            -DTENZOR_BUILD_VULKAN=OFF \
            -DTENZOR_BUILD_PYTHON=OFF \
            -DTENZOR_BUILD_TESTS=ON \
            -DTENZOR_BUILD_BENCHMARKS=OFF \
            -DTENZOR_BUILD_EXAMPLES=OFF \
            -DTENZOR_BUILD_MODEL_HUB=OFF

      - name: Build
        run: ninja -C build

      - name: Run core tests
        run: |
          cd build
          ctest --output-on-failure -j$(nproc) \
            -R "TensorBasicTest|TensorCreationTest|AutogradTest" \
            -E "cuda|vulkan|oneapi|rocm" \
            --timeout 120

  # Tier 1.85: Windows build (CPU-only smoke test)
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake
        run: cmake -B build -DTENZOR_BUILD_CUDA=OFF -DTENZOR_BUILD_VULKAN=OFF -DTENZOR_BUILD_ROCM=OFF -DTENZOR_BUILD_ONEAPI=OFF -DTENZOR_BUILD_PYTHON=OFF -DTENZOR_BUILD_MODEL_HUB=OFF
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Test
        run: cd build && ctest -C Release --output-on-failure -R "cpu" --timeout 120

  # Tier 1.9: macOS build (CPU-only smoke test)
  macos-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake
        run: cmake -B build -DTENZOR_BUILD_CUDA=OFF -DTENZOR_BUILD_VULKAN=OFF -DTENZOR_BUILD_ROCM=OFF -DTENZOR_BUILD_ONEAPI=OFF -DTENZOR_BUILD_PYTHON=OFF -DTENZOR_BUILD_MODEL_HUB=OFF
      - name: Build
        run: cmake --build build --config Release -j 3
      - name: Test (CPU)
        run: cd build && ctest --output-on-failure -R "cpu" --timeout 120

  # Tier 2: Full CPU tests (every PR, ~30 min)
  full-cpu-tests:
    name: Full CPU Test Suite
    runs-on: ubuntu-24.04
    needs: build-and-smoke
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libgtest-dev \
            libomp-dev \
            python3-dev \
            python3-pybind11 \
            pybind11-dev \
            libmkl-dev \
            libtbb-dev

      - name: Configure and build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DTENZOR_BUILD_CUDA=OFF \
            -DTENZOR_BUILD_ROCM=OFF \
            -DTENZOR_BUILD_ONEAPI=OFF \
            -DTENZOR_BUILD_VULKAN=OFF \
            -DTENZOR_BUILD_PYTHON=ON \
            -DTENZOR_BUILD_TESTS=ON \
            -DTENZOR_BUILD_MODEL_HUB=OFF \
            -DTENZOR_ENABLE_COVERAGE=ON
          ninja -C build

      - name: Run all CPU tests
        run: |
          cd build
          ctest --output-on-failure -j$(nproc) \
            -E "cuda|vulkan|oneapi|rocm" \
            --timeout 300
        timeout-minutes: 45

      - name: Collect coverage
        if: success() || failure()
        run: |
          lcov --capture --directory build --output-file coverage.info
          lcov --remove coverage.info '/usr/*' '*/tests/*' '*/build/*' --output-file coverage.info

      - name: Upload coverage to Codecov
        if: success() || failure()
        uses: codecov/codecov-action@v4
        with:
          files: coverage.info
          fail_ci_if_error: false

      - name: Run Python tests
        run: |
          cd build
          ctest --output-on-failure -L python --timeout 60
        timeout-minutes: 10

  # Tier 2.5: Nightly benchmarks (performance regression detection)
  benchmarks:
    name: Nightly Benchmarks
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libomp-dev \
            libmkl-dev \
            libtbb-dev

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DTENZOR_BUILD_CUDA=OFF \
            -DTENZOR_BUILD_ROCM=OFF \
            -DTENZOR_BUILD_ONEAPI=OFF \
            -DTENZOR_BUILD_VULKAN=OFF \
            -DTENZOR_BUILD_PYTHON=OFF \
            -DTENZOR_BUILD_TESTS=OFF \
            -DTENZOR_BUILD_BENCHMARKS=ON \
            -DTENZOR_BUILD_EXAMPLES=OFF \
            -DTENZOR_BUILD_MODEL_HUB=OFF

      - name: Run benchmarks
        run: bash scripts/ci_benchmark.sh
        timeout-minutes: 60

      - name: Download previous benchmark results
        id: previous
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results
          path: previous_benchmark_results
        continue-on-error: true

      - name: Compare with previous run
        if: steps.previous.outcome == 'success'
        run: |
          python3 scripts/compare_benchmarks.py \
            --threshold 10 \
            previous_benchmark_results/all.json \
            build/benchmark_results/all.json \
            | tee benchmark_comparison.md

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: build/benchmark_results/
          retention-days: 90

      - name: Upload comparison report
        if: steps.previous.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-comparison
          path: benchmark_comparison.md
          retention-days: 30

  # Tier 3: Nightly comprehensive tests
  nightly:
    name: Nightly Comprehensive
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libgtest-dev \
            libomp-dev \
            python3-dev \
            python3-pybind11 \
            pybind11-dev \
            libmkl-dev \
            libtbb-dev

      - name: Configure and build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DTENZOR_BUILD_CUDA=OFF \
            -DTENZOR_BUILD_ROCM=OFF \
            -DTENZOR_BUILD_ONEAPI=OFF \
            -DTENZOR_BUILD_VULKAN=OFF \
            -DTENZOR_BUILD_PYTHON=ON \
            -DTENZOR_BUILD_TESTS=ON \
            -DTENZOR_BUILD_MODEL_HUB=OFF \
            -DTENZOR_ENABLE_COVERAGE=ON
          ninja -C build

      - name: Run full test suite
        run: |
          cd build
          ctest --output-on-failure -j$(nproc) \
            -E "cuda|vulkan|oneapi|rocm" \
            --timeout 600
        timeout-minutes: 120

      - name: Generate coverage report
        if: success() || failure()
        run: |
          sudo apt-get install -y lcov
          cd build
          lcov --capture --directory . --output-file coverage.info --ignore-errors mismatch
          lcov --remove coverage.info '/usr/*' '*/tests/*' '*/build/*' --output-file coverage.info
          lcov --list coverage.info

      - name: Check coverage threshold
        run: |
          COVERAGE=$(lcov --summary build/coverage.info 2>&1 | grep 'lines' | grep -oP '[\d.]+(?=%)')
          echo "Line coverage: ${COVERAGE}%"
          THRESHOLD=70
          if [ "$(echo "$COVERAGE < $THRESHOLD" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi

      - name: Upload coverage
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage.info
