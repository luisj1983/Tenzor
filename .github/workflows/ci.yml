name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_TYPE: Release
  CMAKE_GENERATOR: Ninja

  # GPU TESTING NOTE:
  # GPU backends (CUDA, ROCm, Vulkan, OneAPI) are gated on a SELF-HOSTED
  # runner (labels: self-hosted, linux, gpu) via two jobs:
  #   * gpu-smoke  — fast CUDA+Vulkan sanity, every PR (~30 min)
  #   * gpu-parity — cross-backend parity across CUDA+ROCm+Vulkan+OneAPI,
  #                  every PR (fast tier) + full nightly sweep + perf gate.
  # GitHub-hosted runners have no GPU, so those jobs stay pending until the
  # self-hosted runner is registered (Settings > Actions > Runners). See
  # CONTRIBUTING.md "Required status checks & branch protection" before
  # marking the GPU checks as required.
  # Local full matrix: scripts/test_all_backends.sh
  # Vulkan-only software path (GitHub-hosted, lavapipe): vulkan-software job.

jobs:
  # Tier 1: Fast smoke tests (~5 min)
  build-and-smoke:
    name: Build & Smoke Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libgtest-dev \
            libomp-dev \
            python3-dev \
            python3-pybind11 \
            pybind11-dev \
            libmkl-dev \
            libtbb-dev

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DTENZOR_BUILD_CUDA=OFF \
            -DTENZOR_BUILD_ROCM=OFF \
            -DTENZOR_BUILD_ONEAPI=OFF \
            -DTENZOR_BUILD_VULKAN=OFF \
            -DTENZOR_BUILD_PYTHON=ON \
            -DTENZOR_BUILD_TESTS=ON \
            -DTENZOR_BUILD_BENCHMARKS=OFF \
            -DTENZOR_BUILD_EXAMPLES=ON \
            -DTENZOR_BUILD_MODEL_HUB=OFF
        # audit-9 JJ.7: TENZOR_BUILD_EXAMPLES=ON in the gateway smoke job so
        # tests/examples/{test_all_autograd_examples, test_hrm_example} link
        # successfully (they depend on example_*_autograd_runner OBJECT libs
        # produced only when examples are configured).  The HRM-style
        # severed-grad_fn regression net is otherwise dark in CI.

      - name: Build core library
        run: ninja -C build tenzor_core

      - name: Build CPU backend
        run: ninja -C build tenzor_backend_cpu

      - name: Build Python module
        run: ninja -C build tenzor_python

      - name: Build tests
        run: ninja -C build

      - name: Verify examples-as-tests are registered (audit-9 JJ.7)
        working-directory: build
        run: |
          count=$(ctest -L examples -N 2>&1 | grep -cE "^\s*Test\s+#[0-9]+:" || true)
          if [ "$count" -lt 22 ]; then
            echo "ERROR: expected >=22 example-as-tests registered, got $count"
            ctest -L examples -N || true
            exit 1
          fi
          echo "OK: $count example-as-tests registered (audit-9 JJ.7 gate)"

      - name: Python import test
        run: |
          cd build
          python3 -c "
          import sys; sys.path.insert(0, 'python')
          import tenzor as tz
          tz.initialize()
          t = tz.zeros([2, 3])
          assert t.shape == [2, 3], f'Expected [2,3], got {t.shape}'
          print('Python import OK')
          "

      - name: Core unit tests
        run: |
          cd build
          ctest --output-on-failure -j$(nproc) \
            -R "TensorBasicTest|TensorCreationTest|TensorMathTest|EmptyTensorTest|NumericalPrecisionTest|ViewSliceTest" \
            --timeout 120

      - name: Autograd tests
        run: |
          cd build
          ctest --output-on-failure -j$(nproc) \
            -R "AllBackends/AutogradTest" \
            -E "cuda|vulkan|oneapi" \
            --timeout 120

      - name: Broadcasting tests
        run: |
          cd build
          ctest --output-on-failure -j$(nproc) \
            -R "AllBackends/BroadcastingTest" \
            -E "cuda|vulkan|oneapi" \
            --timeout 120

      - name: Op coverage check
        run: |
          cd build
          ./bin/op_coverage_report --check ../tools/op_coverage_baseline.json

  # Tier 1.5: Sanitizer build (ASAN + UBSAN, ~15 min)
  sanitizer:
    name: ASAN + UBSAN
    runs-on: ubuntu-24.04
    needs: build-and-smoke
    if: github.event_name == 'pull_request'
    env:
      CMAKE_BUILD_TYPE: Debug
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libgtest-dev \
            libomp-dev \
            libmkl-dev \
            libtbb-dev

      - name: Configure (sanitizers, no Python)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DTENZOR_BUILD_CUDA=OFF \
            -DTENZOR_BUILD_ROCM=OFF \
            -DTENZOR_BUILD_ONEAPI=OFF \
            -DTENZOR_BUILD_VULKAN=OFF \
            -DTENZOR_BUILD_PYTHON=OFF \
            -DTENZOR_BUILD_TESTS=ON \
            -DTENZOR_BUILD_BENCHMARKS=OFF \
            -DTENZOR_BUILD_EXAMPLES=OFF \
            -DTENZOR_BUILD_MODEL_HUB=OFF

      - name: Build
        run: ninja -C build

      - name: Run tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1,halt_on_error=1,suppressions=sanitizer_suppressions.txt
          UBSAN_OPTIONS: halt_on_error=1,print_stacktrace=1
        run: |
          cd build
          ctest --output-on-failure -j$(nproc) \
            -E "cuda|vulkan|oneapi|rocm" \
            --timeout 600
        timeout-minutes: 30

  # Tier 1.6: ThreadSanitizer build (~15 min)
  thread-sanitizer:
    name: ThreadSanitizer
    runs-on: ubuntu-24.04
    needs: build-and-smoke
    if: github.event_name == 'pull_request'
    env:
      CMAKE_BUILD_TYPE: Debug
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libgtest-dev \
            libomp-dev \
            libmkl-dev \
            libtbb-dev

      - name: Configure (TSan, no Python)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=thread -fno-sanitize-recover=all" \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-sanitize-recover=all" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=thread" \
            -DTENZOR_BUILD_CUDA=OFF \
            -DTENZOR_BUILD_ROCM=OFF \
            -DTENZOR_BUILD_ONEAPI=OFF \
            -DTENZOR_BUILD_VULKAN=OFF \
            -DTENZOR_BUILD_PYTHON=OFF \
            -DTENZOR_BUILD_TESTS=ON \
            -DTENZOR_BUILD_BENCHMARKS=OFF \
            -DTENZOR_BUILD_EXAMPLES=OFF \
            -DTENZOR_BUILD_MODEL_HUB=OFF

      - name: Build
        run: ninja -C build

      - name: Run thread-safety tests under TSan
        env:
          TSAN_OPTIONS: halt_on_error=1,second_deadlock_stack=1,suppressions=sanitizer_suppressions.txt
        run: |
          cd build
          ctest --output-on-failure -j1 \
            -R "AutogradTest|ThreadSafety|test_hooks|test_thread" \
            -E "cuda|vulkan|oneapi|rocm" \
            --timeout 300
        timeout-minutes: 20

  # Tier 1.75: GPU SMOKE — fast per-PR GPU sanity on the self-hosted runner.
  #
  # REQUIRES a registered self-hosted runner with labels
  # `self-hosted, linux, gpu` (Settings > Actions > Runners). This is the
  # quick tier: build CUDA+Vulkan and run the CUDA/Vulkan-tagged tests so an
  # obviously-broken GPU backend fails within ~30 min instead of waiting for
  # the full parity sweep (gpu-parity).
  #
  # NOTE: this used to share the `gpu-tests` job key with the full parity job
  # below — a YAML duplicate-key collision where one silently shadowed the
  # other. They are now distinct jobs (gpu-smoke + gpu-parity) so both run.
  gpu-smoke:
    name: GPU Smoke (self-hosted)
    runs-on: [self-hosted, gpu, linux]
    needs: build-and-smoke
    # SECURITY: only run on PRs from the SAME repository, never forks. A
    # self-hosted runner executes the PR's build/test code with access to the
    # host; an unguarded fork PR would be arbitrary-code-execution on our runner.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configure with GPU backends
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DTENZOR_BUILD_CUDA=ON \
            -DTENZOR_BUILD_VULKAN=ON \
            -DTENZOR_BUILD_PYTHON=OFF \
            -DTENZOR_BUILD_TESTS=ON \
            -DTENZOR_BUILD_BENCHMARKS=OFF \
            -DTENZOR_BUILD_EXAMPLES=OFF \
            -DTENZOR_BUILD_MODEL_HUB=OFF

      - name: Build
        run: ninja -C build

      - name: Run GPU tests
        env:
          # Hard-fail instead of silent-skip when a backend-parity test can't
          # find >=2 backends; silent skips hid broken GPU init before.
          TENZOR_REQUIRE_MULTI_BACKEND: '1'
        run: |
          cd build
          ctest -R "cuda|vulkan" -j4 \
            --output-on-failure --timeout 300

  # Tier 1.76: Vulkan tests using software renderer (lavapipe)
  vulkan-software:
    name: Vulkan (Software Renderer)
    runs-on: ubuntu-24.04
    needs: build-and-smoke
    if: github.event_name == 'pull_request'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libgtest-dev \
            libomp-dev \
            python3-dev \
            python3-pybind11 \
            pybind11-dev \
            libmkl-dev \
            libtbb-dev \
            mesa-vulkan-drivers \
            vulkan-tools \
            libvulkan-dev

      - name: Verify Vulkan (lavapipe)
        run: vulkaninfo --summary || true

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DTENZOR_BUILD_CUDA=OFF \
            -DTENZOR_BUILD_ROCM=OFF \
            -DTENZOR_BUILD_ONEAPI=OFF \
            -DTENZOR_BUILD_VULKAN=ON \
            -DTENZOR_BUILD_PYTHON=ON \
            -DTENZOR_BUILD_TESTS=ON \
            -DTENZOR_BUILD_BENCHMARKS=OFF \
            -DTENZOR_BUILD_EXAMPLES=OFF \
            -DTENZOR_BUILD_MODEL_HUB=OFF

      - name: Build
        run: ninja -C build

      - name: Run Vulkan tests
        env:
          TENZOR_REQUIRE_MULTI_BACKEND: '1'
        run: |
          cd build
          ctest -R "vulkan" -j1 \
            --output-on-failure --timeout 300

  # Tier 1.8: Clang build (catches different warnings/errors than GCC)
  clang-build:
    name: Clang-18 Build
    runs-on: ubuntu-24.04
    needs: build-and-smoke
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libgtest-dev \
            libomp-dev \
            libmkl-dev \
            libtbb-dev \
            clang-18

      - name: Configure with Clang
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DTENZOR_BUILD_CUDA=OFF \
            -DTENZOR_BUILD_ROCM=OFF \
            -DTENZOR_BUILD_ONEAPI=OFF \
            -DTENZOR_BUILD_VULKAN=OFF \
            -DTENZOR_BUILD_PYTHON=OFF \
            -DTENZOR_BUILD_TESTS=ON \
            -DTENZOR_BUILD_BENCHMARKS=OFF \
            -DTENZOR_BUILD_EXAMPLES=OFF \
            -DTENZOR_BUILD_MODEL_HUB=OFF

      - name: Build
        run: ninja -C build

      - name: Run core tests
        run: |
          cd build
          ctest --output-on-failure -j$(nproc) \
            -R "TensorBasicTest|TensorCreationTest|AutogradTest" \
            -E "cuda|vulkan|oneapi|rocm" \
            --timeout 120

  # Tier 1.85: Windows build (CPU-only smoke test)
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake
        run: cmake -B build -DTENZOR_BUILD_CUDA=OFF -DTENZOR_BUILD_VULKAN=OFF -DTENZOR_BUILD_ROCM=OFF -DTENZOR_BUILD_ONEAPI=OFF -DTENZOR_BUILD_PYTHON=OFF -DTENZOR_BUILD_MODEL_HUB=OFF
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Test
        run: cd build && ctest -C Release --output-on-failure -R "cpu" --timeout 120

  # Tier 1.9: macOS build (CPU-only smoke test)
  macos-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake
        run: cmake -B build -DTENZOR_BUILD_CUDA=OFF -DTENZOR_BUILD_VULKAN=OFF -DTENZOR_BUILD_ROCM=OFF -DTENZOR_BUILD_ONEAPI=OFF -DTENZOR_BUILD_MPS=OFF -DTENZOR_BUILD_PYTHON=OFF -DTENZOR_BUILD_MODEL_HUB=OFF
      - name: Build
        run: cmake --build build --config Release -j 3
      - name: Test (CPU)
        run: cd build && ctest --output-on-failure -R "cpu" --timeout 120

  # Tier 1.95: macOS MPS (Apple Metal) backend build + tests
  # Validates the MPS backend on a real Mac runner. This is the only way the
  # MPS backend gets tested — the primary dev environment is Linux x86_64.
  # Every MPS-touching PR must pass this job before merging.
  macos-mps:
    name: macOS MPS Backend
    runs-on: macos-14  # Sonoma — minimum supported macOS for the MPS backend
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install ninja
          # Xcode command-line tools (incl. xcrun, metal compiler) are preinstalled on macos-14

      - name: Verify Metal toolchain
        run: |
          xcrun --sdk macosx metal --version || true
          xcrun --sdk macosx metallib --version || true

      - name: Configure with MPS enabled
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DTENZOR_BUILD_CUDA=OFF \
            -DTENZOR_BUILD_VULKAN=OFF \
            -DTENZOR_BUILD_ROCM=OFF \
            -DTENZOR_BUILD_ONEAPI=OFF \
            -DTENZOR_BUILD_MPS=ON \
            -DTENZOR_BUILD_PYTHON=OFF \
            -DTENZOR_BUILD_TESTS=ON \
            -DTENZOR_BUILD_BENCHMARKS=OFF \
            -DTENZOR_BUILD_EXAMPLES=OFF \
            -DTENZOR_BUILD_MODEL_HUB=OFF

      - name: Build core + MPS backend + tests
        run: |
          ninja -C build tenzor_core tenzor_backend_cpu tenzor_backend_mps
          ninja -C build

      - name: Op coverage report (verify MPS registers ops)
        run: |
          cd build
          ./bin/op_coverage_report 2>&1 | tail -25

      - name: Run MPS backend tests
        run: |
          cd build
          ctest --output-on-failure -j1 \
            -R "[Mm]ps|MPS" \
            --timeout 300

      - name: Run cross-backend parity tests (MPS subset)
        env:
          TENZOR_REQUIRE_MULTI_BACKEND: '1'
        run: |
          cd build
          ctest --output-on-failure -j1 \
            -R "backend_parity" \
            --timeout 600 || true  # Tolerated until MPS reaches parity in Phase 6

  # Tier 2: Full CPU tests (every PR, sharded by label for parallelism)
  full-cpu-tests:
    name: CPU Tests (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    needs: build-and-smoke
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        shard: [unit, nn, autograd, ops, jit, core, backend_parity, integration]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libgtest-dev \
            libomp-dev \
            python3-dev \
            python3-pybind11 \
            pybind11-dev \
            libmkl-dev \
            libtbb-dev

      - name: Configure and build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DTENZOR_BUILD_CUDA=OFF \
            -DTENZOR_BUILD_ROCM=OFF \
            -DTENZOR_BUILD_ONEAPI=OFF \
            -DTENZOR_BUILD_VULKAN=OFF \
            -DTENZOR_BUILD_PYTHON=ON \
            -DTENZOR_BUILD_TESTS=ON \
            -DTENZOR_BUILD_MODEL_HUB=OFF \
            -DTENZOR_ENABLE_COVERAGE=ON
          ninja -C build

      - name: Run ${{ matrix.shard }} tests
        env:
          # For the backend_parity shard (CPU-only here): have the parity
          # harness tally how many REAL recorded-golden comparisons ran, so
          # the next step can assert a coverage floor instead of trusting a
          # green run that may have silently degraded to zero comparisons
          # (e.g. goldens never recorded / input generator drifted).
          TENZOR_GOLDEN_COVERAGE_REPORT: ${{ github.workspace }}/build/golden_coverage.txt
        run: |
          cd build
          ctest --output-on-failure -j$(nproc) \
            -L "${{ matrix.shard }}" \
            -E "cuda|vulkan|oneapi|rocm" \
            --timeout 300
        timeout-minutes: 30

      # Coverage floor: fail the backend_parity shard if too few real
      # golden comparisons actually executed. The parity harness writes a
      # running tally to $TENZOR_GOLDEN_COVERAGE_REPORT (one file per test
      # binary, last-writer-wins per binary); we sum all such files. A floor
      # of 0 here would defeat the purpose, so we require a meaningful count.
      #
      # FLOOR is intentionally conservative — bump it as goldens are
      # recorded (see scripts/test_all_backends.sh --record-goldens). If this
      # fails with "0 comparisons", the committed goldens in
      # tests/backend_parity/golden/ are missing or stale: regenerate them on
      # a multi-backend host.
      - name: Assert parity golden-coverage floor
        if: matrix.shard == 'backend_parity'
        run: |
          FLOOR=25
          total=0
          shopt -s nullglob
          # Harness writes one file per test process: golden_coverage.txt.<pid>
          for f in build/golden_coverage.txt.*; do
            n=$(tr -dc '0-9' < "$f" 2>/dev/null || echo 0)
            n=${n:-0}
            echo "  $f: $n comparisons"
            total=$((total + n))
          done
          echo "Total recorded-golden parity comparisons: $total (floor: $FLOOR)"
          if [ "$total" -lt "$FLOOR" ]; then
            echo "::error::Only $total golden parity comparisons ran (< $FLOOR floor)."
            echo "::error::Committed goldens in tests/backend_parity/golden/ are missing or stale."
            echo "::error::Regenerate on a multi-backend host: scripts/test_all_backends.sh --record-goldens"
            exit 1
          fi

      - name: Collect coverage
        if: success() || failure()
        run: |
          lcov --capture --directory build --output-file coverage-${{ matrix.shard }}.info
          lcov --remove coverage-${{ matrix.shard }}.info '/usr/*' '*/tests/*' '*/build/*' --output-file coverage-${{ matrix.shard }}.info

      - name: Upload coverage to Codecov
        if: success() || failure()
        uses: codecov/codecov-action@v4
        with:
          files: coverage-${{ matrix.shard }}.info
          flags: ${{ matrix.shard }}
          fail_ci_if_error: false

  # Python tests (separate job, not label-sharded)
  python-tests:
    name: Python Tests
    runs-on: ubuntu-24.04
    needs: build-and-smoke
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libgtest-dev \
            libomp-dev \
            python3-dev \
            python3-pybind11 \
            pybind11-dev \
            libmkl-dev \
            libtbb-dev

      - name: Configure and build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DTENZOR_BUILD_CUDA=OFF \
            -DTENZOR_BUILD_ROCM=OFF \
            -DTENZOR_BUILD_ONEAPI=OFF \
            -DTENZOR_BUILD_VULKAN=OFF \
            -DTENZOR_BUILD_PYTHON=ON \
            -DTENZOR_BUILD_TESTS=ON \
            -DTENZOR_BUILD_MODEL_HUB=OFF
          ninja -C build

      - name: Run Python tests
        run: |
          cd build
          ctest --output-on-failure -L python --timeout 60
        timeout-minutes: 10

  # Tier 2.5: Nightly benchmarks (performance regression detection)
  benchmarks:
    name: Nightly Benchmarks
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libomp-dev \
            libmkl-dev \
            libtbb-dev

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DTENZOR_BUILD_CUDA=OFF \
            -DTENZOR_BUILD_ROCM=OFF \
            -DTENZOR_BUILD_ONEAPI=OFF \
            -DTENZOR_BUILD_VULKAN=OFF \
            -DTENZOR_BUILD_PYTHON=OFF \
            -DTENZOR_BUILD_TESTS=OFF \
            -DTENZOR_BUILD_BENCHMARKS=ON \
            -DTENZOR_BUILD_EXAMPLES=OFF \
            -DTENZOR_BUILD_MODEL_HUB=OFF

      - name: Run benchmarks
        run: bash scripts/ci_benchmark.sh
        timeout-minutes: 60

      # Compare against the COMMITTED, version-controlled baseline for this
      # runner host (benchmarks/baselines/<host>.json). Unlike the old
      # ephemeral-artifact flow, this is reproducible and reviewable in the
      # PR diff. compare_benchmarks.py exits non-zero on a >7% regression
      # (default FAILURE_THRESHOLD) — and we DO NOT swallow that exit code,
      # so the benchmark job now FAILS on regression. To refresh the floor,
      # open a PR updating the baseline file (see benchmarks/baselines/README.md).
      - name: Compare against committed baseline
        id: bench_compare
        run: |
          HOST="ubuntu-24.04"  # matches runs-on for this job
          BASELINE="benchmarks/baselines/${HOST}.json"
          if [ ! -f "$BASELINE" ]; then
            echo "::warning::No committed baseline at $BASELINE — recording one is a follow-up."
            echo "::warning::Seed it via: cp build/benchmark_results/all.json $BASELINE (in a PR)."
            exit 0
          fi
          python3 scripts/compare_benchmarks.py \
            "$BASELINE" \
            build/benchmark_results/all.json \
            | tee benchmark_comparison.md

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: build/benchmark_results/
          retention-days: 90

      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-comparison
          path: benchmark_comparison.md
          retention-days: 30

  # Tier 3: Nightly comprehensive tests
  nightly:
    name: Nightly Comprehensive
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libgtest-dev \
            libomp-dev \
            python3-dev \
            python3-pybind11 \
            pybind11-dev \
            libmkl-dev \
            libtbb-dev

      - name: Configure and build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DTENZOR_BUILD_CUDA=OFF \
            -DTENZOR_BUILD_ROCM=OFF \
            -DTENZOR_BUILD_ONEAPI=OFF \
            -DTENZOR_BUILD_VULKAN=OFF \
            -DTENZOR_BUILD_PYTHON=ON \
            -DTENZOR_BUILD_TESTS=ON \
            -DTENZOR_BUILD_MODEL_HUB=OFF \
            -DTENZOR_ENABLE_COVERAGE=ON
          ninja -C build

      - name: Run full test suite
        run: |
          cd build
          ctest --output-on-failure -j$(nproc) \
            -E "cuda|vulkan|oneapi|rocm" \
            --timeout 600
        timeout-minutes: 120

      - name: Generate coverage report
        if: success() || failure()
        run: |
          sudo apt-get install -y lcov
          cd build
          lcov --capture --directory . --output-file coverage.info --ignore-errors mismatch
          lcov --remove coverage.info '/usr/*' '*/tests/*' '*/build/*' --output-file coverage.info
          lcov --list coverage.info

      - name: Check coverage threshold
        run: |
          COVERAGE=$(lcov --summary build/coverage.info 2>&1 | grep 'lines' | grep -oP '[\d.]+(?=%)')
          echo "Line coverage: ${COVERAGE}%"
          THRESHOLD=70
          if [ "$(echo "$COVERAGE < $THRESHOLD" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi

      - name: Upload coverage
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage.info

  # =========================================================================
  # Code Quality: clang-format check + Python linting
  # =========================================================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-24.04
    needs: build-and-smoke
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18 clang-tidy-18 ninja-build \
            libopenblas-dev python3-pip
          pip install black flake8 mypy

      - name: clang-format check
        run: |
          find src include -name '*.cpp' -o -name '*.hpp' -o -name '*.h' | \
            xargs clang-format-18 --dry-run -Werror 2>&1 | head -100
        continue-on-error: true

      - name: clang-tidy check
        run: |
          cmake -B build-tidy -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DTENZOR_BUILD_CUDA=OFF \
            -DTENZOR_BUILD_ROCM=OFF \
            -DTENZOR_BUILD_VULKAN=OFF \
            -DTENZOR_BUILD_ONEAPI=OFF \
            -DTENZOR_BUILD_TESTS=OFF \
            -DTENZOR_BUILD_PYTHON=OFF
          # Run clang-tidy on a subset of core files
          find src/core src/autograd src/ops -name '*.cpp' | head -20 | \
            xargs clang-tidy-18 -p build-tidy 2>&1 | tail -50
        continue-on-error: true

      - name: Python lint - black
        run: black --check python/ || true

      - name: Python lint - flake8
        run: flake8 python/ --max-line-length=120 --ignore=E501,W503 || true

      - name: Python type check - mypy
        run: mypy python/tenzor/ --ignore-missing-imports

  # =========================================================================
  # GPU PARITY: cross-backend parity on a self-hosted runner. This is a
  # GATING PR CHECK — it runs on EVERY pull_request (no opt-in label) and on
  # main pushes, so cross-backend divergence cannot merge. The full nightly
  # sweep runs on schedule.
  #
  # REQUIRES a registered self-hosted runner with labels
  # `self-hosted, linux, gpu` (repo Settings > Actions > Runners). That
  # machine must have CUDA + ROCm + Vulkan + OneAPI toolchains installed —
  # this job builds all four so parity is checked across the full matrix
  # (the committed goldens / per-backend numbers assume all are present).
  #
  # Per CLAUDE.md testing constraints: always -j1 (the AMD/ROCm driver is
  # fragile under parallel test processes), and keep the PR tier scoped to a
  # fast subset instead of the full 15+ hour suite. TENZOR_REQUIRE_MULTI_BACKEND=1
  # turns silent "only one backend" skips into hard failures.
  #
  # To exclude a known-bad backend from a single run without code changes,
  # set TENZOR_SKIP_BACKENDS=cuda,rocm (honored by the parity harness).
  #
  # NOTE: previously shared the `gpu-tests` job key with the smoke job above —
  # a YAML duplicate-key collision. Now a distinct `gpu-parity` job.
  # =========================================================================
  gpu-parity:
    name: GPU Backend Parity (self-hosted)
    runs-on: [self-hosted, linux, gpu]
    needs: build-and-smoke
    # SECURITY: for the pull_request trigger, only run on SAME-repo PRs (never
    # forks) — a fork PR would execute attacker code on the self-hosted GPU
    # runner. schedule/main-ref triggers are inherently trusted.
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
      || github.event_name == 'schedule'
      || github.ref == 'refs/heads/main'
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Configure with CUDA + ROCm + Vulkan + OneAPI backends
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTENZOR_BUILD_CUDA=ON \
            -DTENZOR_BUILD_ROCM=ON \
            -DTENZOR_BUILD_VULKAN=ON \
            -DTENZOR_BUILD_ONEAPI=ON \
            -DTENZOR_BUILD_PYTHON=OFF \
            -DTENZOR_BUILD_TESTS=ON \
            -DTENZOR_BUILD_BENCHMARKS=OFF \
            -DTENZOR_BUILD_EXAMPLES=OFF

      - name: Build core + tests
        run: ninja -C build -j1

      - name: Run core correctness tests
        working-directory: build
        run: ctest -R "^test_(dtype_promotion|alias_detection|mutation_version|dispatch_interceptor_stack|view_tracking)$" --output-on-failure -j1

      # ---- PR tier: fast cross-backend parity subset (gating) -------------
      # Scoped to the high-signal parity labels. -j1 per ROCm fragility.
      - name: Cross-backend parity (PR fast tier)
        if: github.event_name == 'pull_request'
        working-directory: build
        env:
          TENZOR_REQUIRE_MULTI_BACKEND: '1'
        run: |
          # --repeat until-pass:3 reruns ONLY a failed test up to 3x and passes
          # if any attempt succeeds. This tolerates rare real-GPU transients
          # (driver/ECC/thermal one-offs) WITHOUT masking regressions: a genuine
          # divergence fails all 3 attempts and blocks the merge. Per-op
          # tolerances are independently measured (not loosened) — e.g. conv3d
          # GPU-vs-CPU max diff ~2.4e-6 over 40 runs vs a 1e-4 bound (240x
          # margin); MFCC ~2.7e-5 vs 1e-2 (375x). So a failure here is a true
          # regression or a rare hardware transient, and retry distinguishes them.
          ctest -L backend_parity \
            -R "operation|nn|gradient|stride|dtype|index|conv|norm|reduction" \
            -j1 --output-on-failure --timeout 600 --repeat until-pass:3

      # ---- Nightly / main tier: full parity sweep -------------------------
      - name: Cross-backend parity (full sweep)
        if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
        working-directory: build
        env:
          TENZOR_REQUIRE_MULTI_BACKEND: '1'
        run: |
          ctest -L backend_parity -j1 --output-on-failure --timeout 900 --repeat until-pass:3

      - name: Run CUDA backend tests
        working-directory: build
        env:
          TENZOR_REQUIRE_MULTI_BACKEND: '1'
        run: ctest -R "cuda|Cuda" --output-on-failure -j1

      - name: Run ROCm backend tests
        working-directory: build
        env:
          TENZOR_REQUIRE_MULTI_BACKEND: '1'
        run: ctest -R "rocm|Rocm|hip|Hip" --output-on-failure -j1

      # ---- Performance regression gate (enforced on the self-hosted host) -
      # The host has a committed baseline entry in
      # tests/backend_parity/baselines/perf_baseline.json, so enforcement
      # engages. TENZOR_PERF_ENFORCE=1 is belt-and-suspenders.
      - name: Performance regression check
        if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
        working-directory: build
        env:
          TENZOR_PERF_ENFORCE: '1'
        run: |
          ctest -R "BaselineRegressionCheck" -j1 --output-on-failure --timeout 900 \
            || ./bin/test_performance_regression \
                 --gtest_filter='*BaselineRegressionCheck*' \
                 --gtest_also_run_disabled_tests

  # =========================================================================
  # GPU Compile Check: Verify CUDA backend compiles (no GPU needed)
  # =========================================================================
  gpu-compile-check:
    name: GPU Compile Check
    runs-on: ubuntu-24.04
    needs: build-and-smoke
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.17
        with:
          cuda: '12.4.0'
          method: 'network'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libopenblas-dev

      - name: Configure with CUDA
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTENZOR_BUILD_CUDA=ON \
            -DTENZOR_BUILD_ROCM=OFF \
            -DTENZOR_BUILD_VULKAN=OFF \
            -DTENZOR_BUILD_ONEAPI=OFF \
            -DTENZOR_BUILD_TESTS=OFF \
            -DTENZOR_BUILD_PYTHON=OFF

      - name: Compile CUDA backend
        run: ninja -C build tenzor_backend_cuda
        timeout-minutes: 15

  # =========================================================================
  # Nightly Fuzzing: Run fuzz targets for short duration
  # =========================================================================
  nightly-fuzz:
    name: Nightly Fuzzing
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libopenblas-dev clang-18

      - name: Build fuzz targets
        run: |
          CC=clang-18 CXX=clang++-18 cmake -B build -G Ninja \
            -DTENZOR_FUZZ=ON \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DTENZOR_BUILD_CUDA=OFF \
            -DTENZOR_BUILD_ROCM=OFF \
            -DTENZOR_BUILD_VULKAN=OFF \
            -DTENZOR_BUILD_ONEAPI=OFF \
            -DTENZOR_BUILD_TESTS=OFF \
            -DTENZOR_BUILD_PYTHON=OFF
          ninja -C build fuzz_deserialize fuzz_safetensors fuzz_tensor_creation \
            fuzz_reshape fuzz_autograd_backward fuzz_matmul_shapes fuzz_type_promotion \
            fuzz_onnx_importer

      - name: Run fuzz targets (60s each)
        run: |
          for target in fuzz_deserialize fuzz_safetensors fuzz_tensor_creation \
                        fuzz_reshape fuzz_autograd_backward fuzz_matmul_shapes \
                        fuzz_type_promotion fuzz_onnx_importer; do
            echo "=== Fuzzing $target ==="
            timeout 70 ./build/fuzz/$target -max_total_time=60 fuzz/corpus/${target#fuzz_}/ 2>&1 || true
          done
