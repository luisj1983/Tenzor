// =============================================================================
// REFERENCE SPECIFICATION — NOT A COMPILED SCHEMA
// =============================================================================
//
// This file is a *reference spec* describing the subset of the TensorFlow
// protobuf wire format that Tenzor's TensorBoard exporter targets. It is NOT
// fed to `protoc`, there is no generated C++/Python code, and there is no
// CMake target that consumes it. It exists purely as human-readable
// documentation of the byte layout that `src/utils/tensorboard.cpp` hand-rolls
// via its varint / length-delimited helpers.
//
// To prevent silent drift between this spec and the encoder, the script
// `tools/check_tensorboard_wire_format.py` parses both this file and the
// `write_field_header(buf, N, W)` / `write_string_field(buf, N, ...)` /
// `write_length_delimited(buf, N, ...)` call sites inside the
// `encode_node_def` / `build_graph_def` helpers in `tensorboard.cpp`, and
// fails if any field number / wire-type pair disagrees.
//
// Editors: if you change a field number or wire type here, run
//     python tools/check_tensorboard_wire_format.py
// and update the encoder in lock-step (or vice versa).
//
// -----------------------------------------------------------------------------
// Wire format (Google protobuf v2/v3):
//   tag        = (field_number << 3) | wire_type
//   wire_type  = 0 (varint) | 1 (64-bit) | 2 (length-delimited) | 5 (32-bit)
//
// Sources cross-referenced against tensorflow/core/framework in the upstream
// TF repository (Apache 2.0). Only the fields actually consumed by
// TensorBoard's graph plugin are retained.

syntax = "proto3";

package tensorboard;

// ---------------------------------------------------------------------------
// tensorflow/core/framework/tensor_shape.proto
// ---------------------------------------------------------------------------
message TensorShapeProto {
    message Dim {
        int64  size = 1;
        string name = 2;
    }
    repeated Dim  dim          = 2;
    bool          unknown_rank = 3;
}

// ---------------------------------------------------------------------------
// tensorflow/core/framework/attr_value.proto (cut down to the variants we use)
// ---------------------------------------------------------------------------
message AttrValue {
    message ListValue {
        repeated bytes              s     = 2;
        repeated int64              i     = 3 [packed = true];
        repeated TensorShapeProto   shape = 6;
    }
    oneof value {
        bytes             s     = 2;
        int64             i     = 3;
        TensorShapeProto  shape = 7;
        ListValue         list  = 1;
    }
}

// ---------------------------------------------------------------------------
// tensorflow/core/framework/node_def.proto
// ---------------------------------------------------------------------------
message NodeDef {
    string             name  = 1;   // Unique node id (e.g. "node_42").
    string             op    = 2;   // Function::name() / op_id() string.
    repeated string    input = 3;   // Names of input nodes (upstream edges).
    string             device = 4;  // Optional, unused here.
    map<string, AttrValue> attr = 5;
}

// ---------------------------------------------------------------------------
// tensorflow/core/framework/graph.proto
// ---------------------------------------------------------------------------
message GraphDef {
    repeated NodeDef node = 1;
}
